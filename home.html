<html>
    <head></head>
    <body>
        <div id="container">
        <h2>Registration Form</h2>
        <form action="">
            <label for="">Name</label>
            <input type="text" id="name" placeholder="Enter name">
            <div id="nameError" name="error"></div>
            <label for="">Username</label>
            <input type="text" id="username" placeholder="Enter username">
            <div id="usernameError" name="error"></div>
            <label for="">Email</label>
            <input type="email" id="email" placeholder="Enter email">
            <div id="emailError" name="error"></div>
            <label for="">Password</label>
            <input type="password" id="password" placeholder="Enter password">
            <div id="passwordError" name="error"></div>
            <label for="">Date of Birth</label>
            <input type="date" id="dob" placeholder="Enter date of birth">
            <div id="dobError" name="error"></div>
            <button id="switch">Create</button> <br>
            <label for="">Already have an account?</label>
            <button id="switch">Login</button>
        </form>
        </div>
    </body>
</html>
